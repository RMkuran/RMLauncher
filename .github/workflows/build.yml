name: Build

on:
  push:
    tags:
      - 'v*'

# リリース作成とファイル添付に必要な権限を明示
permissions:
  contents: write

jobs:
  # 1. リリースの枠（Draft）を作成するジョブ
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true

  # 2. ビルドし、作成されたリリースにファイルを添付するジョブ
  build:
    runs-on: ${{ matrix.os }}
    needs: release

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: matrix.os == 'windows-latest'
        with:
          # アップロードしたいファイルを指定
          files: |
            dist/**/*.exe
            dist/**/*.blockmap
            dist/**/latest.yml